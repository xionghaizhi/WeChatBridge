name: macOS Test Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: macos-test-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-test\.[0-9]+)?$ ]]; then
            echo 'Use vX.Y.Z or vX.Y.Z-test.N for a macOS test release.' >&2
            exit 1
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        working-directory: macos
        run: swift test

      - name: Check localizations
        working-directory: macos
        run: swift Scripts/check-localizations.swift

      - name: Check release configuration
        run: macos/Scripts/check-release-config.sh

      - name: Build universal ad-hoc test package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash macos/Scripts/package-test-release.sh "$RELEASE_TAG"

      - name: Keep packaged files for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-test-release
          path: macos/dist/test-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download this run's package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-test-release
          path: package

      - name: Verify packaged checksums
        working-directory: package
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish a test release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" package/* \
            --verify-tag --prerelease --latest=false \
            --title "macOS 自用测试包 $RELEASE_TAG（未公证）" \
            --notes-file package/TESTING.zh-CN.md
